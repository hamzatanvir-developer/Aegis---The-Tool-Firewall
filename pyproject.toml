[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-firewall"
version = "0.1.0"
description = "Sub-millisecond runtime security firewall for AI agent tool calls."
readme = "README.md"
authors = [{ name = "Muhammad Hamza" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
aegis = "aegis.cli:main"